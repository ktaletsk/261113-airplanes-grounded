name: Publish to GitHub Pages

# Builds the WebAssembly version from the committed snapshot (public/bundle.npz).
# No adsb.lol access here: it blocks GitHub's runners. Refresh the snapshot with scripts/update_snapshot.sh.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Export the notebook to WebAssembly
        run: |
          uvx marimo@0.25.2 export html-wasm grounded.py -o _site --mode run
          rm -f _site/CLAUDE.md
          ls -la _site/public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
